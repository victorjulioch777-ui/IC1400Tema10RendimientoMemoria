name: Compilar LaTeX

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-publishers

      - name: Compilar PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Subir PDF compilado
        uses: actions/upload-artifact@v7
        with:
          name: investigacion-memoria-pdf
          path: main.pdf
